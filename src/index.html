<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>e-note</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- MENU LATERAL -->
  <div id="menu">

    <!-- AUTOR -->
    <div class="menu-item">
      <button id="autor-btn">Autor</button>

      <div id="autor-submenu" class="submenu hidden">
        <button id="autor-novo">Novo</button>
        <button id="autor-lista">Lista</button>
      </div>
    </div>

    <!-- TAG -->
    <div class="menu-item">
      <button id="tag-btn">Tag</button>

      <div id="tag-submenu" class="submenu hidden">
        <button id="tag-novo">Nova</button>
        <button id="tag-lista">Lista</button>
      </div>
    </div>

    <!-- NOTA -->
    <div class="menu-item">
      <button id="note-btn">Nota</button>

      <div id="note-submenu" class="submenu hidden">
        <button id="note-novo">Escrever</button>
      </div>
    </div>

    <!-- FILTRO POR TAGS -->
    <div class="menu-item">
      <select id="select-tags" name="select-tags"></select>
    </div>

    <!-- FILTRO POR PESQUISA DE TEXTO -->
    <div class="menu-item">
      <input type="search" id="note-search" name="note-search">
      <button id="search-btn">Procurar</button>
    </div>

  </div>

  <!-- COLUNA 2: LISTA (por enquanto vazia) -->
  <div id="list">
    <em>Lista</em>
  </div>

  <!-- COLUNA 3: AÇÃO -->
  <div id="action">
    <em>Selecione uma opção no menu</em>
  </div>

  <!-- MODAL DE CONFIRMAÇÃO -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-content">
      <h3>e-note</h3>
      <p id="confirmMessage"></p>

      <div class="modal-actions">
        <button id="confirmYes" class="danger">Apagar</button>
        <button id="confirmNo">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- SELETOR DE LINK INTERNO -->
  <div id="internal-link-box" class="hidden">
    <input 
        type="text" 
        id="internal-link-search" 
        placeholder="Digite o título da nota..."
    />

    <ul id="internal-link-results"></ul>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
